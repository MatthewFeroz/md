<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{DOCUMENT_TITLE}}</title>
  <style>
    :root {
      --ink: #171714;
      --muted: #67675f;
      --paper: #f5f2e9;
      --panel: rgba(255, 255, 255, 0.58);
      --line: rgba(23, 23, 20, 0.15);
      --orange: #f48120;
      --yellow: #f6c344;
      --violet: #7057d9;
    }

    * { box-sizing: border-box; }

    @page {
      size: Letter;
      margin: 0;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      color: var(--ink);
      background: #deddd8;
      font-family: Arial, Helvetica, sans-serif;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    body { padding: 32px; }

    .sheet {
      width: 8.5in;
      height: 11in;
      margin: 0 auto;
      padding: 0.54in 0.62in 0.46in;
      overflow: hidden;
      background:
        radial-gradient(circle at 92% 4%, rgba(244, 129, 32, 0.18), transparent 26%),
        radial-gradient(circle at 4% 95%, rgba(112, 87, 217, 0.12), transparent 24%),
        var(--paper);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.15);
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      gap: 0.22in;
    }

    .eyebrow-row,
    .footer-grid,
    .discussion-item {
      display: grid;
      align-items: start;
    }

    .eyebrow-row {
      grid-template-columns: 1fr auto;
      gap: 20px;
      padding-bottom: 0.14in;
      border-bottom: 1px solid var(--line);
    }

    .companies,
    .proposal-label,
    .section-label,
    .footer-label {
      font-size: 8.2pt;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .companies { letter-spacing: 0.08em; }
    .proposal-label { color: var(--muted); }

    .hero h1 {
      max-width: 7in;
      margin: 0;
      font-size: 38pt;
      line-height: 0.98;
      letter-spacing: -0.045em;
    }

    .thesis {
      max-width: 6.8in;
      margin: 0.14in 0 0;
      color: #3f3f39;
      font-size: 14.6pt;
      line-height: 1.3;
      letter-spacing: -0.012em;
    }

    .accent-rule {
      width: 1.45in;
      height: 5px;
      margin-top: 0.16in;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--violet), var(--orange), var(--yellow));
    }

    .content-grid {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1.22fr) minmax(0, 0.78fr);
      gap: 0.34in;
    }

    .column {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 0.2in;
    }

    .section-label {
      margin-bottom: 0.08in;
      color: var(--muted);
    }

    .overview p,
    .voice-role,
    .discussion-text,
    .footer-value {
      margin: 0;
      font-size: 9.6pt;
      line-height: 1.43;
    }

    .overview p + p { margin-top: 0.12in; }

    .card {
      padding: 0.18in 0.19in;
      border: 1px solid rgba(23, 23, 20, 0.09);
      border-radius: 14px;
      background: var(--panel);
    }

    .voice-list {
      display: flex;
      flex-direction: column;
      gap: 0.09in;
    }

    .voice-item + .voice-item {
      padding-top: 0.09in;
      border-top: 1px solid var(--line);
    }

    .voice-name {
      margin: 0 0 0.02in;
      font-size: 9pt;
      font-weight: 700;
      line-height: 1.3;
    }

    .voice-role {
      color: #3f3f39;
      font-size: 8.8pt;
      line-height: 1.38;
    }

    .discussion-list {
      display: flex;
      flex-direction: column;
      gap: 0.08in;
    }

    .discussion-item {
      grid-template-columns: 0.28in 1fr;
      gap: 0.08in;
      padding-top: 0.09in;
      border-top: 1px solid var(--line);
    }

    .discussion-number {
      color: var(--orange);
      font-size: 9pt;
      font-weight: 700;
      line-height: 1.43;
    }

    .footer-grid {
      grid-template-columns: 1fr 1fr 0.9fr;
      gap: 0.2in;
      padding-top: 0.16in;
      border-top: 1px solid var(--line);
    }

    .footer-label {
      margin-bottom: 0.05in;
      color: var(--muted);
      font-size: 7.8pt;
    }

    .footer-value {
      font-size: 8.6pt;
      line-height: 1.38;
    }

    .partner-guide {
      display: inline-block;
      margin-top: 0.09in;
      color: var(--ink);
      font-size: 8.2pt;
      font-weight: 700;
      text-decoration-color: var(--orange);
      text-decoration-thickness: 2px;
      text-underline-offset: 3px;
    }

    @media screen and (max-width: 860px) {
      body {
        padding: 0;
        background: var(--paper);
      }

      .sheet {
        width: 100%;
        height: auto;
        min-height: 100vh;
        padding: 28px;
        box-shadow: none;
      }

      .content-grid,
      .footer-grid { grid-template-columns: 1fr; }
    }

    @media print {
      html,
      body {
        width: 8.5in;
        height: 11in;
        background: transparent;
      }

      body { padding: 0; }

      .sheet {
        margin: 0;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  <main class="sheet">
    <header class="eyebrow-row">
      <div class="companies">{{COMPANY_LINE}}</div>
      <div class="proposal-label">Event proposal</div>
    </header>

    <section class="hero">
      <h1>{{TITLE}}</h1>
      <p class="thesis">{{THESIS}}</p>
      <div class="accent-rule" aria-hidden="true"></div>
    </section>

    <section class="content-grid">
      <div class="column">
        <section>
          <div class="section-label">The event</div>
          <div class="overview">{{OVERVIEW_HTML}}</div>
        </section>

        <section class="card">
          <div class="section-label">Key voices</div>
          <div class="voice-list">{{VOICE_HTML}}</div>
        </section>
      </div>

      <div class="column">
        <section>
          <div class="section-label">Discussion anchors</div>
          <div class="discussion-list">{{DISCUSSION_HTML}}</div>
        </section>
      </div>
    </section>

    <footer class="footer-grid">
      <section>
        <div class="footer-label">Audience</div>
        <p class="footer-value">{{AUDIENCE}}</p>
      </section>
      <section>
        <div class="footer-label">Desired outcome</div>
        <p class="footer-value">{{OUTCOME}}</p>
      </section>
      <section>
        <div class="footer-label">Next step</div>
        <p class="footer-value">{{STATUS}}</p>
        {{PARTNER_GUIDE_HTML}}
      </section>
    </footer>
  </main>
</body>
</html>
